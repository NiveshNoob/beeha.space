<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Episode 8</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    height:100vh;
    display:flex;
    flex-direction:column;
    font-family:sans-serif;
}

.player{
    flex:1;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

.controls{
    background:#111;
    padding:15px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

button{
    border:none;
    padding:12px 24px;
    border-radius:12px;
    background:#ffc83d;
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

button.active{
    background:#00d26a;
}

</style>
</head>

<body>

<div class="player">
    <iframe
        id="video-player"
        src="https://streamtape.com/e/P3WjO3yoxlTBQb/"
        allowfullscreen>
    </iframe>
</div>

<div class="controls">

<button
id="server1-btn"
class="active"
onclick="setProvider('server1')">
Server 1
</button>

<button
id="server2-btn"
onclick="setProvider('server2')">
Server 2
</button>

<button id="prev-btn">
← Previous Episode
</button>

<button id="next-btn">
Next Episode →
</button>

</div>

<script>

const providers = {
    server1: "https://streamtape.com/e/P3WjO3yoxlTBQb/",
    server2: "https://streamtape.com/e/P3WjO3yoxlTBQb/"
};

function setProvider(provider)
{
    document.getElementById(
        "video-player"
    ).src = providers[provider];

    document
    .querySelectorAll(".controls button")
    .forEach(btn =>
        btn.classList.remove("active")
    );

    document
    .getElementById(
        provider + "-btn"
    )
    .classList.add("active");
}

const currentEpisode =
    8;

document
.getElementById("prev-btn")
.onclick = () =>
{
    if(currentEpisode > 1)
    {
        window.location.href =
            `${currentEpisode - 1}.html`;
    }
};

document
.getElementById("next-btn")
.onclick = () =>
{
    if(currentEpisode < 12)
    {
        window.location.href =
            `${currentEpisode + 1}.html`;
    }
};

</script>

</body>
</html>
