<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Episode 1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.player{
    flex:1;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

.controls{
    background:#111;
    padding:15px;

    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    border:none;

    padding:12px 24px;

    border-radius:12px;

    background:#ffc83d;

    color:#111;

    font-weight:bold;

    cursor:pointer;
}

button:hover{
    opacity:.9;
}
</style>
</head>
<body>

<div class="player">
    <iframe
        src="https://voe.sx/e/5e5banyl1he6"
        allowfullscreen>
    </iframe>
</div>

<div class="controls">

    <button id="prev-btn">
        ← Previous Episode
    </button>

    <button id="next-btn">
        Next Episode →
    </button>

</div>

<script>
const currentFile =
    window.location.pathname
        .split("/")
        .pop();

const currentEpisode =
    parseInt(
        currentFile.replace(
            ".html",
            ""
        )
    );

document
.getElementById("prev-btn")
.onclick = () =>
{
    if(currentEpisode > 1)
    {
        window.location.href =
            `${currentEpisode - 1}.html`;
    }
};

document
.getElementById("next-btn")
.onclick = () =>
{
    window.location.href =
        `${currentEpisode + 1}.html`;
};
</script>

</body>
</html>
