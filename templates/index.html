<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16120d">
    <title>Beeha</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<main>
    <section class="hero" aria-label="Beeha home">
        <header class="navbar">
            <a href="/" class="logo"><span class="logo-mark" aria-hidden="true">🐝</span><span>beeha</span></a>
            <nav class="main-nav" aria-label="Primary navigation">
                <a class="active" href="/"><span>⌂</span> Home</a>
                <a href="#library"><span>▣</span> Anime</a>
                <a href="#about"><span>ⓘ</span> About</a>
            </nav>
        </header>
        <div class="hero-controls">
            <div class="search-wrap">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="search" type="search" placeholder="Search anime, manga, novel..." autocomplete="off" aria-label="Search anime">
                <button id="clear-search" class="clear-search" type="button" aria-label="Clear search">×</button>
            </div>
            <div class="year-picker">
                <span class="year-caption">▦ &nbsp; Year</span><button id="all-years" class="year-all active" type="button">All Years</button><button id="previous-year" class="year-arrow" type="button" aria-label="Previous year">‹</button><span id="year-label">—</span><button id="next-year" class="year-arrow" type="button" aria-label="Next year">›</button>
            </div>
        </div>
        <a class="scroll-cue" href="#library"><span>⌄</span> Scroll Down</a>
    </section>

    <section id="library" class="library">
        <div class="library-header">
            <div>
                <span class="label">LIBRARY</span>
                <h2>Anime</h2>
                <p id="result-count" class="result-count" aria-live="polite"></p>
            </div>
        </div>

        <div id="anime-list" class="anime-grid" aria-live="polite"></div>
        <div id="loading-state" class="empty-state"><div class="empty-icon">◌</div><h3>Loading the hive...</h3><p>Fetching the library from Beeha.</p></div>
        <div id="empty-state" class="empty-state hidden"><div class="empty-icon">🐝</div><h3>No anime found</h3><p>Try another search or year.</p></div>
    </section>
</main>

<footer id="about" class="footer">
    <span>🐝 Beeha</span>
    <span>FastAPI · Made for the hive.</span>
</footer>
<script src="https://pl31436920.profitableratecpmnetwork.com/ba/1f/a4/ba1fa4ba57ed0fb84ed4dac4bcb44994.js"></script>
<script src="{{ url_for('static', path='script.js') }}" defer></script>
</body>
</html>
